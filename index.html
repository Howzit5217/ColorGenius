<body>
<a class="skip-link" href="#main">Skip to the page</a>
<header class="topbar">
  <div class="topbar-in">
    <button class="logo" id="homeBtn" type="button" aria-label="ColorGenius home">
      <span class="fan" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="logo-text">ColorGenius</span>
    </button>
    <span class="grow"></span>
    <button type="button" class="top-btn" id="lockBtn" aria-label="Staff: unlock the kiosk" hidden>
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4.5" y="10.5" width="15" height="10.5" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 018 0v3"/><circle cx="12" cy="15.3" r="1.4" fill="currentColor" stroke="none"/><path d="M12 16.5v1.8"/></svg>
      <span class="top-label">Staff</span>
    </button>
    <button type="button" class="top-btn" id="settingsBtn" aria-label="Settings">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M10.17 4.62L10.33 1.94L13.67 1.94L13.83 4.62A7.6 7.6 0 0 1 15.92 5.49L17.93 3.7L20.3 6.07L18.51 8.08A7.6 7.6 0 0 1 19.38 10.17L22.06 10.33L22.06 13.67L19.38 13.83A7.6 7.6 0 0 1 18.51 15.92L20.3 17.93L17.93 20.3L15.92 18.51A7.6 7.6 0 0 1 13.83 19.38L13.67 22.06L10.33 22.06L10.17 19.38A7.6 7.6 0 0 1 8.08 18.51L6.07 20.3L3.7 17.93L5.49 15.92A7.6 7.6 0 0 1 4.62 13.83L1.94 13.67L1.94 10.33L4.62 10.17A7.6 7.6 0 0 1 5.49 8.08L3.7 6.07L6.07 3.7L8.08 5.49A7.6 7.6 0 0 1 10.17 4.62Z"/><circle cx="12" cy="12" r="3.3"/></svg>
      <span class="top-label">Settings</span>
    </button>
  </div>
</header>

<main class="main" id="main" tabindex="-1">
  <section class="loading" id="loading" aria-live="polite">
    <div class="loading-fan" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    <p id="loadingText">Getting the paint colors ready…</p>
  </section>
  <div id="view" hidden></div>
</main>

<nav class="bottom-bar" id="bottomBar" aria-label="Question buttons" hidden>
  <div class="bottom-in">
    <button type="button" class="btn big ghost" data-flow="back"><svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><path d="M12.5 4L6.5 10l6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>Back</button>
    <span class="grow"></span>
    <button type="button" class="btn big primary" data-flow="next"><span class="enter-hint" aria-hidden="true">Enter <span class="ret">↵</span></span><span class="next-label">Next</span><svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><path d="M7.5 4l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
</nav>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" hidden></div>
<div class="onboard" id="onboard" role="dialog" aria-modal="true" aria-labelledby="obTitle" hidden></div>
<div class="present" id="present" role="dialog" aria-modal="true" aria-label="Colors, full screen" hidden></div>
<div id="printArea" aria-hidden="true"></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="js/stain.js"></script>
<script src="js/engine.js"></script>
<script src="js/tools.js"></script>
<script src="js/scenes.js"></script>
<script src="js/room3d.js"></script>
<script src="js/app.js"></script>
</body>
</html>
