<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ColorGenius</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="The paint department in your pocket: find paint and stain colors, see them in a room, and know which paint, primer, roller and brush to buy.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f5f3ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141413" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ColorGenius">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600;700;800&family=Atkinson+Hyperlegible+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/app.css">
<link rel="preload" as="image" href="icons/icon-192.png">
<link rel="preload" as="image" href="img/tile-paint.jpg">
<link rel="preload" as="image" href="img/tile-stain.jpg">
<link rel="preload" as="image" href="img/tile-buy.jpg">
<link rel="preload" as="image" href="img/tile-lookup.jpg">
</head>
<body>
<a class="skip-link" href="#main">Skip to the page</a>
<header class="topbar">
  <div class="topbar-in">
    <button class="logo" id="homeBtn" type="button" aria-label="ColorGenius home">
      <img class="logo-mark" src="icons/icon-192.png" alt="" width="36" height="36" decoding="async">
      <span class="logo-text">ColorGenius</span>
    </button>
    <span class="grow"></span>
    <button type="button" class="top-btn" id="homeNav" aria-label="Home" hidden>
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 11L12 4l8.5 7"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg>
      <span class="top-label">Home</span>
    </button>
    <button type="button" class="top-btn" id="projBtn" aria-label="Your project" hidden>
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="4.5" width="14" height="16.5" rx="2.5"/><path d="M9.5 4.5V3h5v1.5"/><path d="M8.5 10h7M8.5 13.5h7M8.5 17h4"/></svg>
      <span class="top-label">Project</span><span class="badge-count" id="projCount">0</span>
    </button>
    <button type="button" class="top-btn" id="lockBtn" aria-label="Staff: unlock the kiosk" hidden>
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4.5" y="10.5" width="15" height="10.5" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 018 0v3"/><circle cx="12" cy="15.3" r="1.4" fill="currentColor" stroke="none"/><path d="M12 16.5v1.8"/></svg>
      <span class="top-label">Staff</span>
    </button>
    <button type="button" class="top-btn" id="settingsBtn" aria-label="Settings">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 8.6a3.4 3.4 0 100 6.8 3.4 3.4 0 000-6.8z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9.9 4.95L10.2 2.95L13.8 2.95L14.1 4.95A7.36 7.36 0 0 1 17.06 6.66L18.94 5.92L20.74 9.03L19.16 10.29A7.36 7.36 0 0 1 19.16 13.71L20.74 14.97L18.94 18.08L17.06 17.34A7.36 7.36 0 0 1 14.1 19.05L13.8 21.05L10.2 21.05L9.9 19.05A7.36 7.36 0 0 1 6.94 17.34L5.06 18.08L3.26 14.97L4.84 13.71A7.36 7.36 0 0 1 4.84 10.29L3.26 9.03L5.06 5.92L6.94 6.66A7.36 7.36 0 0 1 9.9 4.95Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      <span class="top-label">Settings</span>
    </button>
  </div>
</header>

<main class="main" id="main" tabindex="-1">
  <section class="loading" id="loading" aria-live="polite">
    <img class="loading-mark" src="icons/icon-192.png" alt="" width="104" height="104">
    <p id="loadingText">Getting the paint colors ready…</p>
  </section>
  <div id="view" hidden></div>
</main>

<nav class="bottom-bar" id="bottomBar" aria-label="Question buttons" hidden>
  <div class="bottom-in">
    <button type="button" class="btn big ghost" data-flow="back"><svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><path d="M12.5 4L6.5 10l6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>Back</button>
    <span class="grow"></span>
    <button type="button" class="btn big primary" data-flow="next"><span class="enter-hint" aria-hidden="true">Enter <span class="ret">↵</span></span><span class="next-label">Next</span><svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><path d="M7.5 4l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
</nav>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" hidden></div>
<div class="onboard" id="onboard" role="dialog" aria-modal="true" aria-labelledby="obTitle" hidden></div>
<div class="present" id="present" role="dialog" aria-modal="true" aria-label="Colors, full screen" hidden></div>
<div id="printArea" aria-hidden="true"></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="data/brands.js"></script>
<script src="js/color.js"></script>
<script src="data/stains.js"></script>
<script src="js/wood.js"></script>
<script src="js/stain.js"></script>
<script src="js/engine.js"></script>
<script src="js/tools.js"></script>
<script src="js/scenes.js"></script>
<script src="js/room3d.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
